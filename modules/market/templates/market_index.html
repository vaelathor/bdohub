<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Central</title>
    <link rel="icon" href="{{ url_for('static', filename='bdo_hub.svg') }}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @font-face {
            font-family: 'Web Pearl';
            src: url('{{ url_for("static", filename="fonts/web_pearl_original.ttf") }}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        h1, h2, .section-title {
            font-family: 'Web Pearl', 'Outfit', sans-serif;
        }

        :root {
            --bg-base: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #0b1220;
            --accent-primary: #38bdf8;
            --accent-gold: #e0b457;
            --glass-border: #334155;
            --muted: #64748b;
            --text-main: #f8fafc;
            --ok: #34d399;
            --bad: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 1rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .logo-icon { color: var(--accent-primary); width: 32px; height: 32px; }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-info { color: var(--muted); font-size: 0.95rem; }

        .search-box {
            position: relative;
            flex-shrink: 0;
        }

        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            pointer-events: none;
        }

        #search-input {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        #search-input::placeholder { color: var(--muted); }

        .results {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.35);
        }

        .results::-webkit-scrollbar { width: 8px; }
        .results::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        .result-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            cursor: pointer;
            transition: background 0.15s;
        }

        .result-row:hover { background: rgba(56, 189, 248, 0.07); }
        .result-row.expanded { background: rgba(56, 189, 248, 0.1); }

        .item-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent-gold);
            position: relative;
        }

        .item-icon svg { width: 24px; height: 24px; }

        .item-icon img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 3px;
        }

        .pin-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.15s, transform 0.15s;
        }

        .pin-btn svg { width: 18px; height: 18px; }
        .pin-btn:hover { color: var(--accent-gold); transform: scale(1.15); }
        .pin-btn.pinned { color: var(--accent-gold); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
        .panel-loading { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.8rem; padding: 0.2rem 0; }
        .panel-loading svg { color: var(--accent-primary); flex-shrink: 0; }

        /* Painel de favoritos */
        .pinned-panel { flex-shrink: 0; }
        .pinned-panel.hidden { display: none; }

        .pinned-head {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .pinned-list {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.4rem;
        }

        .pinned-list::-webkit-scrollbar { height: 6px; }
        .pinned-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }

        .pinned-card {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 0.5rem 0.7rem;
            cursor: pointer;
            flex-shrink: 0;
            max-width: 300px;
            min-width: 0;
            transition: border-color 0.15s, background 0.15s;
        }

        .pinned-card:hover { border-color: var(--accent-primary); background: rgba(56, 189, 248, 0.07); }

        .pinned-card .p-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            flex-shrink: 0;
            position: relative;
        }

        .pinned-card .p-icon svg { width: 18px; height: 18px; }
        .pinned-card .p-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 2px; }
        .pinned-card .p-info { min-width: 0; }
        .pinned-card .p-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pinned-card .p-price { font-size: 0.8rem; color: var(--accent-gold); }
        .pinned-card .p-stock { font-size: 0.72rem; }

        .pinned-remove {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .pinned-remove:hover { color: var(--bad); }

        /* Alertas de disponibilidade (níveis vigiados) */
        .watch-panel { flex-shrink: 0; }
        .watch-panel.hidden { display: none; }

        .watch-list {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.4rem;
        }

        .watch-card {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 0.5rem 0.7rem;
            cursor: pointer;
            flex-shrink: 0;
            max-width: 360px;
            min-width: 0;
            transition: border-color 0.15s, background 0.15s;
        }

        .watch-card:hover { border-color: var(--accent-primary); background: rgba(56, 189, 248, 0.07); }
        .watch-card .w-info { min-width: 0; }
        .watch-card .w-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .watch-card .w-name .w-lvl { color: var(--accent-gold); }
        .watch-card .w-status { font-size: 0.75rem; margin-top: 2px; }
        .w-status.live { color: var(--ok); }
        .w-status.alert { color: var(--accent-gold); font-weight: 700; }
        .w-status.out { color: var(--muted); }

        .dot-live {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            margin-right: 5px;
            vertical-align: middle;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .watch-new-badge {
            background: var(--accent-gold);
            color: #0b1220;
            font-size: 0.62rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 8px;
            margin-left: 4px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .watch-remove {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .watch-remove:hover { color: var(--bad); }
        .watch-check { font-size: 0.7rem; color: var(--muted); }

        /* Sino de vigilância nas linhas de aprimoramento */
        .watch-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            padding: 3px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.15s, transform 0.15s;
        }

        .watch-btn svg { width: 16px; height: 16px; }
        .watch-btn:hover { color: var(--accent-gold); transform: scale(1.15); }
        .watch-btn.active { color: var(--accent-gold); }

        /* Histórico de preços (90 dias) */
        .detail-flex { display: flex; align-items: stretch; gap: 1rem; }
        .hist-chart { flex: 1; min-width: 0; padding: 0.4rem 0 0.2rem; }
        .hist-chart .chart-title { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.35rem; }
        .chart-flex { display: flex; align-items: stretch; gap: 0.9rem; }
        .chart-vals { flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-right: 0.9rem; border-right: 1px solid var(--glass-border); font-size: 0.78rem; }
        .chart-vals .cv-row { display: flex; justify-content: space-between; gap: 0.8rem; }
        .chart-vals .cv-row span { color: var(--muted); }
        .chart-vals .cv-row b { color: var(--accent-gold); font-weight: 600; }
        .chart-vals .cv-pct { margin-top: 5px; font-weight: 700; }
        .chart-main { flex: 1; min-width: 0; }
        .chart-box { display: block; width: 100%; height: 76px; }
        .chart-dates { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
        .c-up { color: var(--ok); }
        .c-down { color: var(--bad); }
        .chart-line { stroke: var(--accent-gold); }
        .chart-fill { fill: var(--accent-gold); opacity: 0.12; }
        .chart-empty { padding: 0.4rem 0; color: var(--muted); font-size: 0.85rem; }

        /* Tendência nos cards de alerta */
        .w-status .trend { font-size: 0.7rem; font-weight: 700; margin-left: 3px; }
        .trend-up { color: var(--ok); }
        .trend-down { color: var(--bad); }

        .item-info { flex: 1; min-width: 0; }

        .item-name {
            font-weight: 600;
            font-size: 0.98rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .item-price-col { text-align: right; flex-shrink: 0; }

        .item-price {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 0.98rem;
        }

        .item-stock { font-size: 0.78rem; margin-top: 2px; }
        .stock-ok { color: var(--ok); }
        .stock-zero { color: var(--bad); }

        .chevron { color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
        .result-row.expanded .chevron { transform: rotate(180deg); }

        /* Sub-lista de aprimoramentos */
        .sub-list {
            background: rgba(11, 18, 32, 0.6);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            display: none;
        }

        .result-row.expanded + .sub-list { display: block; }

        .sub-header {
            display: flex;
            gap: 1rem;
            padding: 0.5rem 1.2rem 0.5rem 4.6rem;
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .sub-header span:nth-child(1) { flex: 1; }
        .sub-header span:nth-child(2) { width: 130px; text-align: right; }
        .sub-header span:nth-child(3) { width: 110px; text-align: right; }

        .sub-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            padding: 0.55rem 1.2rem 0.55rem 4.6rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .sub-row.zebra { background: rgba(30, 41, 59, 0.3); }
        .sub-row:hover { background: rgba(56, 189, 248, 0.07); }
        .sub-row.expanded { background: rgba(56, 189, 248, 0.1); }
        .sub-row .enh { flex: 1; color: var(--text-main); font-weight: 600; }
        .sub-row .enh span { color: var(--accent-gold); }
        .sub-row .price { width: 130px; text-align: right; color: var(--accent-gold); }
        .sub-row .price .from { display: block; font-size: 0.72rem; font-weight: 400; color: var(--muted); }
        .sub-row .stock { width: 110px; text-align: right; font-size: 0.8rem; }
        .sub-row .caret { width: 20px; text-align: right; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
        .sub-row.expanded .caret { transform: rotate(180deg); }

        /* Livro de ofertas de um nível */
        .offer-block {
            background: rgba(11, 18, 32, 0.75);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            padding: 0.4rem 1.2rem 0.6rem 4.6rem;
            display: none;
        }

        .sub-row.expanded + .offer-block { display: block; }

        .offer-wrap { flex-shrink: 0; width: 340px; }

        .offer-head {
            display: flex;
            gap: 0.5rem;
            padding: 0.4rem 0;
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .offer-head span:nth-child(1) { flex: 1; }
        .offer-head span:nth-child(2) { width: 70px; text-align: right; }
        .offer-head span:nth-child(3) { width: 70px; text-align: right; }

        .offer-row {
            display: flex;
            gap: 0.5rem;
            padding: 0.3rem 0;
            font-size: 0.85rem;
        }

        .offer-row .oprice { flex: 1; color: var(--accent-gold); font-weight: 600; font-size: 0.82rem; }
        .offer-row .osellers { width: 70px; text-align: right; }
        .offer-row .obuyers { width: 70px; text-align: right; }
        .offer-empty { padding: 0.5rem 0; color: var(--muted); font-size: 0.85rem; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            gap: 0.6rem;
            padding: 2rem;
            text-align: center;
        }

        .empty-state svg { opacity: 0.4; }
        .empty-state .hint { font-size: 0.85rem; }

        .footer {
            flex-shrink: 0;
            font-size: 0.72rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="logo-area">
            <i data-lucide="coins" class="logo-icon"></i>
            <h1>Mercado Central</h1>
        </div>
        <div class="nav-info">Preços e ofertas do mercado &middot; SA</div>
    </header>

    <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
        <input id="search-input" type="text" placeholder="Pesquisar item no mercado..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="pinned-panel hidden" id="pinned-panel">
        <div class="pinned-head"><span>Favoritos</span><span id="pinned-count"></span></div>
        <div class="pinned-list" id="pinned-list"></div>
    </div>

    <div class="watch-panel hidden" id="watch-panel">
        <div class="pinned-head"><span>Alertas de disponibilidade</span><span id="watch-count"></span></div>
        <div class="watch-list" id="watch-list"></div>
    </div>

    <div class="results" id="results">
        <div class="empty-state" id="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"></circle><path d="M18.09 10.37A6 6 0 1 1 10.34 18"></path><path d="M7 6h1v4"></path><path d="m16.71 13.88.7.71-2.82 2.82"></path></svg>
            <span>Digite o nome de um item para buscar</span>
            <span class="hint">Ex.: kzarka, anel, pen, moeda corvo...</span>
        </div>
    </div>

    <div class="footer">
        <span id="result-count"></span>
        <span>Dados: api.arsha.io &middot; cache de 15 min</span>
    </div>

    <script>
        lucide.createIcons();
        loadPinned();
        loadWatched();

        const input = document.getElementById('search-input');
        const resultsEl = document.getElementById('results');
        const countEl = document.getElementById('result-count');

        // Nomenclatura do servidor SA (PT-BR): VII = HEP e IX = ENE (no EN são SEP e NOV)
        const ENH_NAMES = ['PRI', 'DUO', 'TRI', 'TET', 'PEN', 'HEX', 'HEP', 'OCT', 'ENE', 'DEC'];

        function fmt(n) {
            return Number(n || 0).toLocaleString('pt-BR');
        }

        // Rótulo de um nível de aprimoramento, conforme a escala do item (verificado
        // contra a wiki oficial da PA, Garmoth e BDOLytics):
        //  - acessórios (cat 20): 1-5 = PRI..PEN, 6-10 = HEX..DEC (clássicos e Prione/Preonne)
        //  - armas/armaduras/ferramentas: 1-15 = +1..+15, 16-20 = PRI..PEN, 21-25 = HEX..DEC
        function levelLabel(level, isAcc) {
            if (level === 0) return '0';
            if (isAcc) {
                if (level >= 1 && level <= 10) return ENH_NAMES[level - 1];
            } else {
                if (level <= 15) return '+' + level;
                if (level >= 16 && level <= 25) return ENH_NAMES[level - 16];
            }
            return 'Nv ' + level;
        }

        // A sub-lista do mercado agrupa níveis com o mesmo preço (ex.: +0~+7 numa
        // linha só); usamos minEnhance/maxEnhance para mostrar a faixa correta.
        function enhLabel(minEnh, maxEnh, mainCategory) {
            const isAcc = mainCategory === 20;
            const lo = (minEnh === undefined || minEnh === null) ? 0 : minEnh;
            const hi = (maxEnh === undefined || maxEnh === null) ? lo : maxEnh;
            if (hi === lo) return levelLabel(lo, isAcc);
            return levelLabel(lo, isAcc) + ' ~ ' + levelLabel(hi, isAcc);
        }

        function fmtTime(ts) {
            if (!ts) return '';
            try {
                return new Date(ts * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (e) { return ''; }
        }

        function fmtCompact(n) {
            if (n == null || !isFinite(n)) return '';
            if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' bi';
            if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' mi';
            if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(0) + ' k';
            return String(n);
        }

        function drawChart(container, prices) {
            if (!prices || prices.length < 2) {
                container.innerHTML = '<div class="chart-empty">Sem histórico disponível.</div>';
                return;
            }
            const n = prices.length;
            const min = Math.min(...prices), max = Math.max(...prices);
            const cur = prices[n - 1];
            const span = (max - min) || 1;
            // gráfico à esquerda (estica para preencher) + coluna de valores à direita
            const w = 600, h = 84, padL = 4, padR = 4, padT = 6, padB = 6;
            const iw = w - padL - padR, ih = h - padT - padB;
            const pt = (p, i) => [padL + (i / (n - 1)) * iw, padT + ih - ((p - min) / span) * ih];
            const line = prices.map((p, i) => pt(p, i).join(',')).join(' ');
            const area = `${padL},${padT + ih} ${line} ${padL + iw},${padT + ih}`;
            const end = new Date();
            const start = new Date(end.getTime() - (n - 1) * 86400000);
            const dstr = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            const pct = ((cur - prices[0]) / prices[0]) * 100;
            const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '＝');
            const pctCls = pct > 0 ? 'c-up' : (pct < 0 ? 'c-down' : '');
            container.innerHTML = `
                <div class="chart-flex">
                    <div class="chart-vals">
                        <div class="cv-row"><span>Máx</span><b>${fmtCompact(max)}</b></div>
                        <div class="cv-row"><span>Mín</span><b>${fmtCompact(min)}</b></div>
                        <div class="cv-row"><span>Atual</span><b>${fmtCompact(cur)}</b></div>
                        <div class="cv-pct ${pctCls}">${arrow} ${Math.abs(pct).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% (90d)</div>
                    </div>
                    <div class="chart-main">
                        <svg class="chart-box" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                            <polygon class="chart-fill" points="${area}"/>
                            <polyline class="chart-line" points="${line}" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                        <div class="chart-dates"><span>${dstr(start)}</span><span>${dstr(end)}</span></div>
                    </div>
                </div>`;
        }

        function iconSvg() {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9z"></path><path d="M11 3 8 9l4 13 4-13-3-6"></path><path d="M2 9h20"></path></svg>';
        }

        function emptyState(primary, hint) {
            resultsEl.innerHTML = `
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"></circle><path d="M18.09 10.37A6 6 0 1 1 10.34 18"></path><path d="M7 6h1v4"></path><path d="m16.71 13.88.7.71-2.82 2.82"></path></svg>
                    <span>${primary}</span>
                    ${hint ? `<span class="hint">${hint}</span>` : ''}
                </div>`;
            countEl.textContent = '';
        }

        function loadingState() {
            resultsEl.innerHTML = `
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"></path><path d="m16.2 7.8 2.9-2.9"></path><path d="M18 12h4"></path><path d="m16.2 16.2 2.9 2.9"></path><path d="M12 18v4"></path><path d="m4.9 19.1 2.9-2.9"></path><path d="M2 12h4"></path><path d="m4.9 4.9 2.9 2.9"></path></svg>
                    <span>Consultando o mercado...</span>
                </div>`;
            countEl.textContent = '';
        }

        let debounceTimer = null;
        let expandedId = null;
        let pinnedIds = new Set();
        let pinnedItems = [];
        let watchedKeys = new Set();
        let watchedList = [];

        function starSvg(filled) {
            return `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
        }

        function panelSpinner() {
            return '<div class="panel-loading"><svg class="spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><span>Carregando...</span></div>';
        }

        async function loadPinned() {
            const panel = document.getElementById('pinned-panel');
            const list = document.getElementById('pinned-list');
            document.getElementById('pinned-count').textContent = '';
            panel.classList.remove('hidden');
            list.innerHTML = panelSpinner();
            try {
                const resp = await fetch('api/pinned');
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                pinnedItems = data.items || [];
                pinnedIds = new Set(pinnedItems.map(i => String(i.id)));
                renderPinned();
            } catch (e) { panel.classList.add('hidden'); }
        }

        function renderPinned() {
            const panel = document.getElementById('pinned-panel');
            const list = document.getElementById('pinned-list');
            document.getElementById('pinned-count').textContent = pinnedItems.length ? `(${pinnedItems.length})` : '';
            if (!pinnedItems.length) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');
            list.innerHTML = '';
            pinnedItems.forEach(it => {
                const card = document.createElement('div');
                card.className = 'pinned-card';
                card.dataset.id = it.id;
                const price = it.price != null ? fmt(it.price) : '—';
                const stock = it.stock != null ? (it.stock > 0 ? `${fmt(it.stock)} ofertas` : 'Sem ofertas') : '';
                card.innerHTML = `
                    <div class="p-icon">${iconSvg()}<img src="api/icon/${it.id}?m=${it.mainCategory}&s=${it.subCategory}" loading="lazy" alt="" onerror="this.remove()"></div>
                    <div class="p-info">
                        <div class="p-name">${it.name}</div>
                        <div class="p-price">${price}</div>
                        <div class="p-stock ${it.stock > 0 ? 'stock-ok' : 'stock-zero'}">${stock}</div>
                    </div>
                    <button class="pinned-remove" title="Remover dos favoritos">&times;</button>`;
                card.addEventListener('click', () => focusPinned(it.id, it.name));
                card.querySelector('.pinned-remove').addEventListener('click', (e) => {
                    e.stopPropagation();
                    togglePinById(it.id);
                });
                list.appendChild(card);
            });
        }

        function bellSvg() {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>';
        }

        async function loadWatched() {
            const panel = document.getElementById('watch-panel');
            const list = document.getElementById('watch-list');
            document.getElementById('watch-count').textContent = '';
            panel.classList.remove('hidden');
            list.innerHTML = panelSpinner();
            try {
                const resp = await fetch('api/watched');
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                watchedList = data.watched || [];
                watchedKeys = new Set(watchedList.map(w => w.id + ':' + w.sid));
                renderWatched();
            } catch (e) { panel.classList.add('hidden'); }
        }

        function renderWatched() {
            const panel = document.getElementById('watch-panel');
            const list = document.getElementById('watch-list');
            document.getElementById('watch-count').textContent = watchedList.length ? `(${watchedList.length})` : '';
            if (!watchedList.length) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');
            list.innerHTML = '';
            watchedList.forEach(w => {
                const st = w.state || {};
                const stock = st.stock;
                let statusCls = 'out';
                let statusHtml = '○ Fora do mercado';
                if (stock > 0) {
                    statusCls = 'live';
                    statusHtml = `<span class="dot-live"></span>NO MERCADO &middot; ${fmt(stock)} oferta${stock === 1 ? '' : 's'}`;
                    if (st.lowestAsk) statusHtml += ` &middot; desde ${fmt(st.lowestAsk)}`;
                    if (st.new) statusHtml += ' <span class="watch-new-badge" title="Marcar como visto">NOVO</span>';
                } else if (st.new && st.lastEntry) {
                    statusCls = 'alert';
                    statusHtml = `▲ Entrou às ${fmtTime(st.lastEntry)}`;
                    if (st.lowestAsk) statusHtml += ` &middot; desde ${fmt(st.lowestAsk)}`;
                    statusHtml += ' <span class="watch-new-badge" title="Marcar como visto">NOVO</span>';
                }
                if (st.trend7 != null && st.trend7 !== 0) {
                    const up = st.trend7 > 0;
                    statusHtml += ` <span class="trend ${up ? 'trend-up' : 'trend-down'}">${up ? '▲' : '▼'} ${Math.abs(st.trend7).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% em 7d</span>`;
                }
                const card = document.createElement('div');
                card.className = 'watch-card';
                card.innerHTML = `
                    <div class="w-info">
                        <div class="w-name">${w.name || ''} <span class="w-lvl">— ${w.label || ''}</span></div>
                        <div class="w-status ${statusCls}">${statusHtml}</div>
                    </div>
                    <button class="watch-remove" title="Parar de vigiar">&times;</button>`;
                card.addEventListener('click', () => {
                    if (w.id) focusPinned(w.id, w.name, w.sid);
                });
                const badge = card.querySelector('.watch-new-badge');
                if (badge) badge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    ackWatch(w.id, w.sid);
                });
                card.querySelector('.watch-remove').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleWatchKey(w.id, w.sid);
                });
                list.appendChild(card);
            });
        }

        async function toggleWatch(itemId, sid, name, label, mainCategory, subCategory) {
            const resp = await fetch('api/watched/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: itemId, sid, name, label, mainCategory, subCategory })
            });
            const data = await resp.json();
            if (data.error) return;
            if (data.watching) watchedKeys.add(itemId + ':' + sid);
            else watchedKeys.delete(itemId + ':' + sid);
            document.querySelectorAll(`.watch-btn[data-key="${itemId}:${sid}"]`).forEach(b => {
                b.classList.toggle('active', data.watching);
                b.title = data.watching ? 'Parar de vigiar' : 'Vigiar disponibilidade (avisa quando entrar no mercado)';
            });
            await loadWatched();
        }

        async function toggleWatchKey(itemId, sid) {
            const w = watchedList.find(x => x.id === itemId && x.sid === sid) || {};
            await toggleWatch(itemId, sid, w.name, w.label, w.mainCategory, w.subCategory);
        }

        async function ackWatch(itemId, sid) {
            await fetch('api/watched/ack', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: itemId, sid })
            });
            await loadWatched();
        }

        async function togglePin(item) {
            const resp = await fetch('api/pinned/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: item.id, name: item.name, mainCategory: item.mainCategory, subCategory: item.subCategory })
            });
            const data = await resp.json();
            if (data.error) return;
            if (data.pinned) pinnedIds.add(String(item.id)); else pinnedIds.delete(String(item.id));
            document.querySelectorAll(`.pin-btn[data-id="${item.id}"]`).forEach(b => {
                b.classList.toggle('pinned', data.pinned);
                b.innerHTML = starSvg(data.pinned);
            });
            await loadPinned();
        }

        async function togglePinById(itemId) {
            const resp = await fetch('api/pinned/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: itemId })
            });
            const data = await resp.json();
            if (data.error) return;
            if (data.pinned) pinnedIds.add(String(itemId)); else pinnedIds.delete(String(itemId));
            document.querySelectorAll(`.pin-btn[data-id="${itemId}"]`).forEach(b => {
                b.classList.toggle('pinned', data.pinned);
                b.innerHTML = starSvg(data.pinned);
            });
            await loadPinned();
        }

        async function focusPinned(id, name, sid) {
            input.value = name;
            const resp = await fetch('api/search?q=' + encodeURIComponent(name));
            const data = await resp.json();
            if (data.error) return;
            renderResults(data.items, data.count);
            const row = document.querySelector(`.result-row[data-id="${id}"]`);
            if (row) {
                const item = data.items.find(i => String(i.id) === String(id));
                if (item && !row.classList.contains('expanded')) await toggleItem(row, item);
                // Se veio de um alerta de disponibilidade, abre direto o nível vigiado
                if (sid != null) {
                    const levelRow = document.querySelector(`.sub-row[data-sid="${sid}"]`);
                    if (levelRow) {
                        if (!levelRow.classList.contains('expanded')) toggleOffers(levelRow, id);
                        levelRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
        }

        input.addEventListener('input', function () {
            clearTimeout(debounceTimer);
            const q = this.value.trim();
            if (q.length < 2) {
                emptyState('Digite o nome de um item para buscar', 'Ex.: kzarka, anel, pen, moeda corvo...');
                return;
            }
            loadingState();
            debounceTimer = setTimeout(() => search(q), 300);
        });

        async function search(q) {
            try {
                const resp = await fetch('api/search?q=' + encodeURIComponent(q));
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                renderResults(data.items, data.count);
                if (data.stale) {
                    countEl.textContent += (countEl.textContent ? ' · ' : '') + '⚠ dados de ' + (data.staleTs ? fmtTime(data.staleTs) : 'cache');
                }
                loadPinned();   // atualiza preços do painel quando o snapshot chega
                loadWatched();  // atualiza estado dos alertas de disponibilidade
            } catch (err) {
                emptyState('O mercado está temporariamente indisponível (API instável)', 'Os dados ficam salvos em cache e devem voltar em instantes. Tente novamente.');
            }
        }

        function renderResults(items, count) {
            countEl.textContent = count > 50 ? `Exibindo 50 de ${fmt(count)} resultados` : (count ? `${fmt(count)} resultado${count === 1 ? '' : 's'}` : '');
            if (!items.length) {
                emptyState('Nenhum item encontrado', 'Tente outro nome ou termo.');
                return;
            }
            resultsEl.innerHTML = '';
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'result-row';
                row.dataset.id = item.id;
                row.innerHTML = `
                    <div class="item-icon">${iconSvg()}<img src="api/icon/${item.id}?m=${item.mainCategory}&s=${item.subCategory}" loading="lazy" alt="" onerror="this.remove()"></div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta">Vendidos: ${fmt(item.totalTrades)}</div>
                    </div>
                    <div class="item-price-col">
                        <div class="item-price">${fmt(item.basePrice)}</div>
                        <div class="item-stock ${item.currentStock > 0 ? 'stock-ok' : 'stock-zero'}">${item.currentStock > 0 ? fmt(item.currentStock) + ' ofertas' : 'Sem ofertas'}</div>
                    </div>
                    <button class="pin-btn ${pinnedIds.has(String(item.id)) ? 'pinned' : ''}" data-id="${item.id}" title="Favoritar item">${starSvg(pinnedIds.has(String(item.id)))}</button>
                    <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
                row.addEventListener('click', () => toggleItem(row, item));
                row.querySelector('.pin-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    togglePin(item);
                });
                resultsEl.appendChild(row);
            });
        }

        async function toggleItem(row, item) {
            const id = row.dataset.id;
            const existingSub = row.nextElementSibling;

            if (row.classList.contains('expanded')) {
                row.classList.remove('expanded');
                if (existingSub && existingSub.classList.contains('sub-list')) existingSub.remove();
                expandedId = null;
                return;
            }

            // Remove expansão anterior
            document.querySelectorAll('.result-row.expanded').forEach(r => {
                r.classList.remove('expanded');
                const s = r.nextElementSibling;
                if (s && s.classList.contains('sub-list')) s.remove();
            });
            expandedId = id;

            row.classList.add('expanded');
            const sub = document.createElement('div');
            sub.className = 'sub-list';
            sub.innerHTML = `
                <div class="sub-header">
                    <span>Aprimoramento</span><span>Preço</span><span>Estoque</span>
                </div>
                <div class="empty-state" style="padding:1.2rem;height:auto">
                    <span>Carregando níveis...</span>
                </div>`;
            row.after(sub);

            try {
                const resp = await fetch('api/item?id=' + id);
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                renderSubList(sub, data.levels || [], item.mainCategory, item.subCategory, id, item.name);
            } catch (err) {
                sub.innerHTML = `
                    <div class="sub-header"><span>Aprimoramento</span><span>Preço</span><span>Estoque</span></div>
                    <div class="empty-state" style="padding:1.2rem;height:auto">
                        <span>Falha ao carregar: ${err.message}</span>
                    </div>`;
            }
        }

        function renderSubList(sub, levels, mainCategory, subCategory, itemId, itemName) {
            const sorted = levels.slice().sort((a, b) => (a.minEnhance ?? a.sid) - (b.minEnhance ?? b.sid));
            sub.innerHTML = `
                <div class="sub-header">
                    <span>Aprimoramento</span><span>Preço</span><span>Estoque</span><span></span>
                </div>`;
            sorted.forEach((l, i) => {
                const lbl = enhLabel(l.minEnhance, l.maxEnhance, mainCategory);
                const wKey = `${itemId}:${l.sid}`;
                const isWatched = watchedKeys.has(wKey);
                const row = document.createElement('div');
                row.className = 'sub-row' + (i % 2 ? ' zebra' : '');
                row.dataset.sid = l.sid;
                row.innerHTML = `
                    <div class="enh">${l.name}${lbl ? `<span> — ${lbl}</span>` : ''}</div>
                    <div class="price">${fmt(l.lastSoldPrice || l.basePrice)}</div>
                    <div class="stock ${l.currentStock > 0 ? 'stock-ok' : 'stock-zero'}">${l.currentStock > 0 ? fmt(l.currentStock) : '—'}</div>
                    <button class="watch-btn ${isWatched ? 'active' : ''}" data-key="${wKey}" title="${isWatched ? 'Parar de vigiar' : 'Vigiar disponibilidade (avisa quando entrar no mercado)'}">${bellSvg()}</button>
                    <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
                row.addEventListener('click', () => toggleOffers(row, itemId));
                row.querySelector('.watch-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleWatch(itemId, l.sid, itemName, lbl || l.name, mainCategory, subCategory);
                });
                sub.appendChild(row);
            });

            // Menor preço listado ("desde X") dos níveis com oferta ativa
            const rows = [...sub.querySelectorAll('.sub-row')];
            sorted.forEach((l, i) => {
                const rowEl = rows[i];
                if (!(l.currentStock > 0)) return;
                (async () => {
                    try {
                        const resp = await fetch(`api/bids?id=${itemId}&sid=${l.sid}`);
                        const data = await resp.json();
                        if (data.error) return;
                        const asks = (data.orders || []).filter(o => o.sellers > 0).map(o => o.price);
                        if (!asks.length) return;
                        const priceEl = rowEl && rowEl.querySelector('.price');
                        if (!priceEl || priceEl.querySelector('.from')) return;
                        const s = document.createElement('span');
                        s.className = 'from';
                        s.textContent = 'desde ' + fmt(Math.min(...asks));
                        priceEl.appendChild(s);
                    } catch (e) { /* silencioso */ }
                })();
            });
        }

        async function toggleOffers(row, itemId) {
            const block = row.nextElementSibling;

            if (row.classList.contains('expanded')) {
                row.classList.remove('expanded');
                if (block && block.classList.contains('offer-block')) block.remove();
                return;
            }

            // Fecha outra oferta aberta
            document.querySelectorAll('.sub-row.expanded').forEach(r => {
                r.classList.remove('expanded');
                const b = r.nextElementSibling;
                if (b && b.classList.contains('offer-block')) b.remove();
            });

            row.classList.add('expanded');
            const off = document.createElement('div');
            off.className = 'offer-block';
            off.innerHTML = `
                <div class="detail-flex">
                    <div class="hist-chart">
                        <div class="chart-title">Histórico de preços (90 dias)</div>
                        <div class="hist-svg"><div class="chart-empty">Carregando histórico...</div></div>
                    </div>
                    <div class="offer-wrap">
                        <div class="offer-head"><span>Preço</span><span>Ofertas</span><span>Compradores</span></div>
                        <div class="offer-empty">Carregando ofertas...</div>
                    </div>
                </div>`;
            row.after(off);

            const sid = row.dataset.sid;
            (async () => {
                try {
                    const resp = await fetch(`api/history?id=${itemId}&sid=${sid}`);
                    const data = await resp.json();
                    const box = off.querySelector('.hist-svg');
                    if (box) drawChart(box, data.history || []);
                } catch (e) { /* silencioso */ }
            })();

            const wrap = off.querySelector('.offer-wrap');
            try {
                const resp = await fetch('api/bids?id=' + itemId + '&sid=' + sid);
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                renderOffers(wrap, data.orders || []);
            } catch (err) {
                wrap.innerHTML = `
                    <div class="offer-head"><span>Preço</span><span>Ofertas</span><span>Compradores</span></div>
                    <div class="offer-empty">Falha ao carregar: ${err.message}</div>`;
            }
        }

        function renderOffers(wrap, orders) {
            const active = orders.filter(o => o.sellers > 0 || o.buyers > 0)
                                 .sort((a, b) => b.price - a.price);
            if (!active.length) {
                wrap.innerHTML = `
                    <div class="offer-head"><span>Preço</span><span>Ofertas</span><span>Compradores</span></div>
                    <div class="offer-empty">Sem ofertas ativas neste nível.</div>`;
                return;
            }
            wrap.innerHTML = `
                <div class="offer-head"><span>Preço</span><span>Ofertas</span><span>Compradores</span></div>` +
                active.map(o => `
                    <div class="offer-row">
                        <div class="oprice">${fmt(o.price)}</div>
                        <div class="osellers ${o.sellers > 0 ? 'stock-ok' : ''}">${o.sellers > 0 ? fmt(o.sellers) : '—'}</div>
                        <div class="obuyers ${o.buyers > 0 ? 'stock-ok' : ''}">${o.buyers > 0 ? fmt(o.buyers) : '—'}</div>
                    </div>`).join('');
        }
    </script>
</body>
</html>
